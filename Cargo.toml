[workspace]
resolver = "2"
members = [
  "rust-examples",
  "xtask",
  "spec/spec-proto",
  "spec/spec-tests",
  "rust/vox-types",
  "rust/vox-schema",
  "rust/vox-core",
  "rust/vox-stream",
  "rust/vox-websocket",
  "rust/vox-inprocess",
  "rust/vox-local",
  "rust/vox-fdpass",
  "rust/vox-ffi",
  "rust/ur-taking-me-with-you",
  "rust/vox-macros-parse",
  "rust/vox-macros-core",
  "rust/vox-macros",
  "rust/vox",
  "rust/subject-rust",
  "rust/vox-codegen",
  "rust/facet-cbor",
  "rust/vox-phon",
  "rust/wasm-browser-tests",
  "rust/wasm-inprocess-tests",
  "typescript/peer-server",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.8.2"
edition = "2024"
rust-version = "1.91"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bearcove/vox"
homepage = "https://github.com/bearcove/vox"
documentation = "https://docs.rs/vox"
keywords = ["rpc", "ipc", "serde", "networking"]
categories = ["network-programming", "asynchronous"]

[workspace.dependencies]
# Internal crates
vox = { path = "rust/vox", version = "0.8.2" }
vox-types = { path = "rust/vox-types", version = "0.8.2" }
vox-schema = { path = "rust/vox-schema", version = "0.8.2" }
vox-macros-parse = { path = "rust/vox-macros-parse", version = "0.8.2" }
vox-macros-core = { path = "rust/vox-macros-core", version = "0.8.2" }
vox-service-macros = { path = "rust/vox-macros", version = "0.8.2" }
vox-core = { path = "rust/vox-core", version = "0.8.2" }
vox-stream = { path = "rust/vox-stream", version = "0.8.2" }
vox-fdpass = { path = "rust/vox-fdpass", version = "0.8.2" }
vox-codegen = { path = "rust/vox-codegen", version = "0.8.2" }
vox-websocket = { path = "rust/vox-websocket", version = "0.8.2" }
vox-inprocess = { path = "rust/vox-inprocess", version = "0.8.2" }
vox-local = { path = "rust/vox-local", version = "0.8.2" }
vox-ffi = { path = "rust/vox-ffi", version = "0.8.2" }
subject-rust = { path = "rust/subject-rust", version = "0.2.2" }
spec-proto = { path = "spec/spec-proto", version = "0.2.2" }
vox-phon = { path = "rust/vox-phon", version = "0.8.2" }

# phon: the next-generation codec (single self-describing schema + compact
# payload codec), replacing vox-postcard + vox-jit on the `phon-codec` branch.
# Local path checkout in the sibling ../phon workspace; builds against the same
# local facet this workspace patches to.
phon = { path = "../phon/rust/phon" }
phon-engine = { path = "../phon/rust/phon-engine" }
phon-ir = { path = "../phon/rust/phon-ir" }
phon-schema = { path = "../phon/rust/phon-schema" }
phon-jit = { path = "../phon/rust/phon-jit" }
facet-cbor = { path = "rust/facet-cbor", version = "0.3.4" }
ur-taking-me-with-you = { path = "rust/ur-taking-me-with-you", version = "8.0.0" }

# Not internal crates
moire = { version = "1.0.0", git = "https://github.com/bearcove/moire", rev = "cf162e7" }
moire-types = { version = "1.0.0", git = "https://github.com/bearcove/moire", rev = "cf162e7" }

arc-swap = "1"
museair = "0.4"
bitflags = "2.11.0"
structstruck = "0.5.1"
bytes = "1"
blake3 = "1.8"
heck = "0.5"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
tokio = { version = "1", features = ["sync", "rt", "time", "macros", "io-util"] }
wasmtimer = { version = "0.4", default-features = false, features = ["tokio"] }
tokio-tungstenite = "0.29"
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
libc = "0.2.180"
tempfile = "3.23"
xshell = "0.2"
passfd = "0.1"

# facet ecosystem
facet = { version = "0.46", features = ["camino", "reflect"] }
facet-core = { version = "0.46" }
facet-postcard = { version = "0.46", features = ["camino"] }
facet-path = { version = "0.46" }
facet-reflect = { version = "0.46" }
facet-format = { version = "0.47" }
facet-pretty = { version = "0.46" }
facet-json = { version = "0.46" }
facet-value = { version = "0.46" }
facet-testhelpers = { version = "0.46" }
facet-cargo-toml = { version = "0.46" }
facet-error = { version = "0.46" }

# Futures utilities
futures-channel = "0.3"
futures-util = "0.3"

# WASM support
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
static_assertions = "1.1.0"
ulid = "1"

indexmap = "2"
smallvec = "1.15.1"
getrandom = { version = "0.4", features = ["wasm_js"] }
zerocopy = { version = "0.8", features = ["derive"] }

# Benchmarking
divan = "0.1"
dprint-plugin-typescript = "0.96"
figue = "4"
prettyplease = "0.2"
insta = "1"
unsynn = "0.3"
cbindgen = "0.29"
loom = "0.7"
windows-sys = "0.61"
tarpc = { version = "0.37", features = ["tokio1", "serde1"] }
tonic = "0.14"
prost = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
serde = { version = "1", features = ["derive"] }
hyper-util = "0.1"
tower = "0.5"
tokio-stream = "0.1"
eyre = "0.6"

# Local facet checkout (same one phon uses) — for the phon codec migration on the
# `phon-codec` branch. The facet ecosystem spans three sibling repos: the core in
# ../facet, the formats (incl. facet-value) in ../facet-format, and facet-cargo-toml
# standalone. Releases land later; until then phon + vox build against these.
[patch.crates-io]
facet = { path = "../facet/facet" }
facet-core = { path = "../facet/facet-core" }
facet-macros = { path = "../facet/facet-macros" }
facet-macros-impl = { path = "../facet/facet-macros-impl" }
facet-macro-parse = { path = "../facet/facet-macro-parse" }
facet-macro-types = { path = "../facet/facet-macro-types" }
facet-reflect = { path = "../facet/facet-reflect" }
facet-solver = { path = "../facet/facet-solver" }
facet-path = { path = "../facet/facet-path" }
facet-error = { path = "../facet/facet-error" }
facet-default = { path = "../facet/facet-default" }
facet-pretty = { path = "../facet/facet-pretty" }
facet-testhelpers = { path = "../facet/facet-testhelpers" }
facet-testhelpers-macros = { path = "../facet/facet-testhelpers-macros" }
facet-validate = { path = "../facet/facet-validate" }
facet-urlencoded = { path = "../facet/facet-urlencoded" }
facet-testattrs = { path = "../facet/facet-testattrs" }
# ../facet-format — every format crate, so any transitively-pulled one builds
# against the same (sealed) facet-format event types rather than a crates.io copy.
facet-value = { path = "../facet-format/facet-value" }
facet-format = { path = "../facet-format/facet-format" }
facet-dessert = { path = "../facet-format/facet-dessert" }
facet-json = { path = "../facet-format/facet-json" }
facet-json-classics = { path = "../facet-format/facet-json-classics" }
facet-postcard = { path = "../facet-format/facet-postcard" }
facet-msgpack = { path = "../facet-format/facet-msgpack" }
facet-toml = { path = "../facet-format/facet-toml" }
facet-yaml = { path = "../facet-format/facet-yaml" }
facet-asn1 = { path = "../facet-format/facet-asn1" }
facet-csv = { path = "../facet-format/facet-csv" }
facet-xdr = { path = "../facet-format/facet-xdr" }
facet-json-schema = { path = "../facet-format/facet-json-schema" }
facet-typescript = { path = "../facet-format/facet-typescript" }
facet-python = { path = "../facet-format/facet-python" }
facet-zod = { path = "../facet-format/facet-zod" }
facet-cargo-toml = { path = "../facet-cargo-toml" }
# figue (used only by xtask) — bump to the local 4.x, which builds against the
# sealed facet (vox pinned the pre-seal 2.0.x).
figue = { path = "../figue/crates/figue" }
figue-attrs = { path = "../figue/crates/figue-attrs" }

# # Uncomment to develop moire
# [patch."https://github.com/bearcove/moire"]
# moire = { path = "../moire/crates/moire" }
# moire-types = { path = "../moire/crates/moire-types" }

[profile.release]
debug = 1

[profile.bench]
debug = 1

[profile.samply]
inherits = "release"
debug = true
