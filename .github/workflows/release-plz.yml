name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release-pr:
    name: Release PR
    runs-on: bearcove-ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.92

      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Publish
    runs-on: bearcove-ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.92

      - name: Authenticate to crates.io (OIDC)
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1.0.4

      - name: Publish facet-cbor if needed
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -n 's/^version = "\(.*\)"/\1/p' rust/facet-cbor/Cargo.toml)"
          crate="facet-cbor@${version}"

          if (cd /tmp && cargo info "${crate}") >/dev/null 2>&1; then
            echo "${crate} is already published"
            exit 0
          fi

          cargo publish -p facet-cbor

          for _ in {1..30}; do
            if (cd /tmp && cargo info "${crate}") >/dev/null 2>&1; then
              echo "${crate} is available on crates.io"
              exit 0
            fi
            sleep 2
          done

          echo "${crate} did not become available on crates.io in time" >&2
          exit 1
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
