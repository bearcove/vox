[package]
name = "vox-afl"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
afl = "0.18"
binette = { git = "https://github.com/bearcove/binette", rev = "c1dc477ecbe8b547e50748451f096bb09db7fb14" }
vox = { path = "../../rust/vox" }
vox-core = { path = "../../rust/vox-core" }
vox-types = { path = "../../rust/vox-types" }
spec-proto = { path = "../../spec/spec-proto" }
subject-rust = { path = "../../rust/subject-rust" }
tokio = { version = "1", features = ["rt", "time", "macros"] }

[[bin]]
name = "protocol_decode"
path = "src/bin/protocol_decode.rs"

[[bin]]
name = "testbed_mem_session"
path = "src/bin/testbed_mem_session.rs"

[[bin]]
name = "protocol_decode_repro"
path = "src/bin/protocol_decode_repro.rs"
